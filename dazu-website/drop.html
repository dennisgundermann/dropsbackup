<!DOCTYPE html>
<html lang="de">
<head>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#FFF6EA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17112E" media="(prefers-color-scheme: dark)">
  <title>dazu öffnen</title>

  <!-- Smart App Banner: zeigt iOS-User automatisch einen "OPEN/INSTALL"-Button für die dazu-App -->
  <meta name="apple-itunes-app" content="app-id=6762097493">

  <link rel="apple-touch-icon" href="/assets/app-icon.png">
  <link rel="icon" href="/assets/app-icon.png">

  <style>
    /* dazu Universal-Link Landing */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }

    :root {
      --orange:   #5B3DF5;
      --green:    #FFA02E;
      --bg:       #FFF6EA;
      --text:     #17112E;
      --text-2:   rgba(17,20,24,0.66);
      --text-3:   rgba(17,20,24,0.42);
      --border:   rgba(0,0,0,0.08);
      --gradient: linear-gradient(135deg, #7C5CFF 0%, #5B3DF5 100%);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg:     #100B22;
        --text:   #F5F5F7;
        --text-2: rgba(245,245,247,0.65);
        --text-3: rgba(245,245,247,0.42);
        --border: rgba(255,255,255,0.10);
      }
    }

    body {
      font-family: 'Nunito', 'Poppins', -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Aurora-Background */
    body::before, body::after {
      content: ""; position: fixed; z-index: -1;
      border-radius: 50%; filter: blur(80px);
      pointer-events: none;
    }
    body::before {
      width: 460px; height: 460px;
      background: var(--orange); opacity: 0.22;
      top: -100px; left: -60px;
    }
    body::after {
      width: 360px; height: 360px;
      background: var(--green); opacity: 0.16;
      bottom: -80px; right: -60px;
    }
    @media (prefers-color-scheme: dark) {
      body::before { opacity: 0.28; }
      body::after  { opacity: 0.22; }
    }

    .card {
      max-width: 420px;
      width: 100%;
      text-align: center;
      position: relative;
      z-index: 1;
    }
    .icon {
      width: 128px;
      height: 128px;
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(91,61,245,0.30), 0 8px 24px rgba(0, 0, 0, 0.08);
      margin: 0 auto 28px;
      display: block;
    }
    h1 {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.035em;
      margin-bottom: 12px;
    }
    p {
      font-size: 15px;
      color: var(--text-2);
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      max-width: 320px;
      padding: 16px 22px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      margin-bottom: 12px;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary {
      background: var(--gradient);
      color: #fff;
      box-shadow: 0 10px 30px rgba(91,61,245,0.35);
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 14px 36px rgba(91,61,245,0.42); }
    .btn-secondary {
      background: rgba(0, 0, 0, 0.05);
      color: var(--text);
      border: 1px solid var(--border);
    }
    @media (prefers-color-scheme: dark) {
      .btn-secondary { background: rgba(255,255,255,0.06); }
    }
    /* Aktivitäts-Icon (eigenes dazu-Icon statt Emoji) auf heller Scheibe */
    .akt {
      width: 104px; height: 104px; margin: 0 auto 14px;
      border-radius: 50%; background: #FFFDF9;
      display: grid; place-items: center;
      box-shadow: 0 12px 34px rgba(91,61,245,0.22), 0 4px 12px rgba(0,0,0,0.06);
    }
    .akt img { width: 60px; height: 60px; display: block; }
    .host-ico { width: 16px; height: 16px; display: block; }
    .live { background: rgba(91,61,245,0.12); color: #5B3DF5; }
    @media (prefers-color-scheme: dark) {
      .live { background: rgba(133,112,255,0.20); color: #C9BDFE; }
      #dpHost { background: rgba(255,255,255,0.08) !important; }
    }
    .footer {
      margin-top: 32px;
      font-size: 12px;
      color: var(--text-3);
    }
    .footer a {
      color: var(--text-2);
      text-decoration: none;
      font-weight: 600;
    }
    .footer a:hover { color: var(--text); text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <!-- Drop-Preview-Karte: wird nur befüllt wenn /drop/<id> erreichbar ist
         UND die Cloud Function getDropSummary erfolgreich antwortet.
         Default: hidden — fallback zur generischen Smart-Banner-View. -->
    <div id="dropPreview" style="display:none; margin-bottom: 24px;">
      <div class="akt"><img id="dpIcon" src="/assets/akt/funkeln.svg" alt=""></div>
      <div style="font-size: 24px; font-weight: 800; color: var(--text); letter-spacing: -0.5px;" id="dpActivity">Plan</div>
      <div style="font-size: 14px; color: var(--text-2); margin-top: 6px;" id="dpLocation"></div>
      <div style="display:flex; gap:12px; justify-content:center; margin-top: 16px; font-size: 13px;">
        <span id="dpHost" style="display:inline-flex; align-items:center; gap:6px; padding:6px 12px; background: rgba(0,0,0,0.05); border-radius:999px;">
          <img class="host-ico" src="/assets/akt/person.svg" alt="">
          <span id="dpHostName">Jemand</span>
        </span>
        <span id="dpStatus" class="live" style="display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px; font-weight:600;">
          <span style="width:8px;height:8px;background:#FFA02E;border-radius:50%;display:inline-block;"></span>
          live
        </span>
      </div>
      <div style="font-size: 13px; color: var(--text-3); margin-top: 12px;" id="dpParticipants">— / —</div>
    </div>

    <img src="/assets/app-icon.png" alt="dazu" class="icon" id="defaultIcon">
    <h1 id="defaultTitle">dazu öffnen</h1>
    <p id="subtitle">
      Tippe auf den Button — wenn du dazu installiert hast, öffnet sich die App direkt.
      Sonst lädst du sie kostenlos im App Store.
    </p>

    <!-- Primary: Versuche App per Universal Link zu öffnen -->
    <a id="openApp" class="btn btn-primary" href="#">
      In dazu öffnen
    </a>

    <!-- Fallback: App Store -->
    <a id="storeBtn" class="btn btn-secondary" href="https://apps.apple.com/de/app/drops-triff-leute/id6762097493" target="_blank">
      Im App Store laden
    </a>

    <div class="footer">
      <a href="/">dazuapp.com</a> · <a href="https://instagram.com/dazu.app" target="_blank" rel="noopener">@dazu.app</a>
    </div>
  </div>

  <script>
    // ── Universal Link + App Store Fallback ──────────────────────────────
    // Re-konstruiere den Original-Universal-Link aus dem aktuellen Pfad
    // (z.B. /drop/<UUID> oder /invite/<UID>) und triggere ihn beim Klick.
    (function () {
      const path = window.location.pathname;
      // iOS Safari öffnet keine Universal Links auf derselben Domain.
      // drops:// Custom Scheme umgeht das Problem direkt.
      // Beispiel: /drop/<UUID> → drops://drop/<UUID>
      const segments = path.split("/").filter(Boolean); // ["drop", "<UUID>"]
      const dropsSchemeUrl = segments.length >= 2
          ? "drops://" + segments[0] + "/" + segments[1]
          : "drops://home";
      const openBtn = document.getElementById("openApp");
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
      const target = isIOS ? dropsSchemeUrl : "https://dazuapp.com" + path;
      openBtn.href = target;

      // Auf iOS / Safari: nach 1.5s Fallback auf App Store wenn die App
      // den Universal Link nicht abfängt (= App nicht installiert).
      openBtn.addEventListener("click", function (e) {
        if (!isIOS) return;  // Auf Desktop: einfach Link folgen lassen

        // Auf iOS: drops:// öffnet die App direkt. Falls App nicht installiert
        // (Schema unbekannt), nach 1.5s auf App Store fallen.
        const fallbackTimer = setTimeout(function () {
          window.location.href = "itms-apps://apps.apple.com/de/app/drops-triff-leute/id6762097493";
        }, 1500);

        // Wenn die Page in den Hintergrund geht (App hat geöffnet) → Timer canceln
        document.addEventListener("visibilitychange", function () {
          if (document.hidden) clearTimeout(fallbackTimer);
        }, { once: true });
      });

      // App-Store-Button: auf iOS itms-apps:// (öffnet App Store direkt,
      // kein Web-Redirect). Auf Desktop target="_blank" reicht.
      const storeBtn = document.getElementById("storeBtn");
      if (isIOS) {
        storeBtn.href = "itms-apps://apps.apple.com/de/app/drops-triff-leute/id6762097493";
        storeBtn.removeAttribute("target"); // kein neues Tab auf iOS nötig
      }

      // Subtitle anpassen je nach URL-Typ (Default-State, wird ggf. von der
      // Drop-Preview-Logik überschrieben).
      const subtitle = document.getElementById("subtitle");
      if (path.startsWith("/drop/")) {
        subtitle.textContent = "Jemand hat dir einen Plan geschickt. Tippe, um ihn in der App zu öffnen.";
      } else if (path.startsWith("/invite/")) {
        subtitle.textContent = "Du wurdest zu dazu eingeladen — tippe um die App zu öffnen oder lade sie kostenlos im App Store.";
      }
    })();

    // ── Drop Preview (Strava-Pattern) ────────────────────────────────────
    // Liest Drop-ID aus URL-Pfad, ruft die Cloud Function getDropSummary auf,
    // rendert Drop-Details vor Install. Bei Fehler: silent fallback zur
    // Default-Smart-Banner-View — User sieht keinen Error.
    // Aktivität → eigenes Icon. Die App speichert je Aktivität weiterhin ein
    // Emoji als Kennung; angezeigt wird überall das dazu-Icon (wie in der App).
    const AKT = {"\ud83d\udccd":"pin","\u2615":"kaffee","\ud83c\udf75":"tee","\ud83e\uddcb":"tee","\ud83c\udf7a":"bier","\ud83c\udf7b":"bier","\ud83c\udf77":"glas","\ud83e\udd42":"glas","\ud83c\udf79":"cocktail","\ud83c\udf78":"cocktail","\ud83c\udf7d":"besteck","\ud83c\udf5c":"besteck","\ud83c\udf2e":"besteck","\ud83e\udd57":"besteck","\ud83c\udf5d":"besteck","\ud83e\udd59":"besteck","\ud83c\udf74":"besteck","\ud83e\udd50":"croissant","\ud83c\udf55":"pizza","\ud83c\udf54":"burger","\ud83c\udf63":"sushi","\ud83c\udf71":"sushi","\ud83c\udf66":"eis","\ud83c\udf82":"kuchen","\ud83c\udf70":"kuchen","\ud83e\uddc1":"kuchen","\ud83d\udc68\u200d\ud83c\udf73":"topf","\ud83e\uddd1\u200d\ud83c\udf73":"topf","\ud83d\udc69\u200d\ud83c\udf73":"topf","\ud83c\udf73":"topf","\ud83e\uddfa":"korb","\ud83d\udeb6":"zufuss","\ud83c\udf33":"baum","\ud83c\udf32":"baum","\ud83d\udc15":"pfote","\ud83d\udc36":"pfote","\ud83d\udc3e":"pfote","\ud83c\udfd6":"strand","\ud83c\udfdd":"strand","\ud83e\udd7e":"wandern","\u26f0":"wandern","\ud83c\udfd4":"wandern","\ud83c\udfc3":"laufen","\ud83d\udcaa":"hantel","\ud83c\udfcb":"hantel","\ud83e\uddd8":"yoga","\ud83d\udeb4":"fahrrad","\ud83d\udeb2":"fahrrad","\ud83c\udfca":"schwimmen","\ud83e\uddd7":"klettern","\ud83d\udc83":"tanz","\u26bd":"fussball","\ud83c\udfc0":"basketball","\ud83c\udfd0":"volleyball","\ud83c\udfbe":"tennis","\ud83c\udff8":"tennis","\ud83c\udfd3":"tennis","\u26f3":"golf","\u26f7":"ski","\ud83c\udfbf":"ski","\ud83c\udfc2":"ski","\ud83c\udfc4":"wellen","\ud83c\udf0a":"wellen","\ud83e\udd4b":"kampfsport","\ud83d\udef9":"skaten","\u26f8":"skaten","\ud83d\udefc":"skaten","\ud83c\udfae":"controller","\ud83d\udd79":"controller","\ud83d\udc7e":"controller","\ud83c\udfb2":"wuerfel","\u265f":"wuerfel","\ud83c\udccf":"wuerfel","\ud83c\udfac":"klappe","\ud83c\udf7f":"klappe","\ud83c\udfa5":"klappe","\ud83c\udfb5":"note","\ud83c\udfb6":"note","\ud83c\udfb8":"note","\ud83c\udfa4":"note","\ud83c\udf89":"party","\ud83e\udd73":"party","\ud83e\udea9":"party","\ud83c\udfdb":"gebaeude","\ud83c\udfa8":"palette","\ud83d\udd8c":"palette","\ud83d\udcf8":"kamera","\ud83d\udcf7":"kamera","\ud83d\udecd":"tuete","\ud83d\uded2":"tuete","\ud83c\udfea":"markt","\ud83d\udcda":"buch","\ud83d\udcd6":"buch","\ud83d\udcbc":"koffer","\ud83d\udcbb":"koffer","\u2728":"funkeln","\u270f":"funkeln"};
    function aktIcon(emoji) {
      if (!emoji) return "funkeln";
      // Variantenzeichen und Hauttöne entfernen
      let key = emoji.replace(/\uFE0F/g, "").replace(/\uD83C[\uDFFB-\uDFFF]/g, "");
      if (AKT[key]) return AKT[key];
      key = key.split("\u200D")[0];       // z. B. Läuferin → Läufer
      return AKT[key] || "funkeln";
    }

    (async function loadDropPreview() {
      const match = window.location.pathname.match(/^\/drop\/([A-Z0-9-]{8,64})$/i);
      if (!match) return;
      const dropID = match[1];

      // Cloud-Function-URL — region+project muss matchen mit functions/index.ts.
      const FN_URL = "https://europe-west1-drops-858d1.cloudfunctions.net/getDropSummary";

      try {
        const res = await fetch(`${FN_URL}?id=${encodeURIComponent(dropID)}`);
        if (!res.ok) return;
        const d = await res.json();
        if (d.error) return;

        // Drop-Preview-Karte befüllen + sichtbar machen.
        document.getElementById("dpIcon").src = "/assets/akt/" + aktIcon(d.activityEmoji) + ".svg";
        document.getElementById("dpActivity").textContent = d.activityName || "Plan";
        document.getElementById("dpLocation").textContent = d.locationTitle || "";
        document.getElementById("dpHostName").textContent = d.hostName || "Jemand";

        // Live-Status: läuft / startet gleich / abgelaufen
        const status = document.getElementById("dpStatus");
        if (!d.isLive) {
          const now = Date.now();
          if (d.createdAt > now) {
            status.innerHTML = '<span style="width:8px;height:8px;background:#F6BD4D;border-radius:50%;display:inline-block;"></span> startet gleich';
            status.style.background = "rgba(246,189,77,0.15)";
            status.style.color = "#8a5a00";
          } else {
            status.innerHTML = '<span style="width:8px;height:8px;background:#888;border-radius:50%;display:inline-block;"></span> beendet';
            status.style.background = "rgba(0,0,0,0.05)";
            status.style.color = "#888";
          }
        } else if (d.expiresAt) {
          const remainingMin = Math.max(1, Math.floor((d.expiresAt - Date.now()) / 60000));
          const remainingLabel = remainingMin >= 60
            ? `noch ${Math.floor(remainingMin/60)}h ${remainingMin%60}m`
            : `noch ${remainingMin} Min`;
          status.innerHTML = `<span style="width:8px;height:8px;background:#FFA02E;border-radius:50%;display:inline-block;"></span> live · ${remainingLabel}`;
        }

        // Teilnehmer
        const cur = d.currentParticipants ?? 1;
        const max = d.maxParticipants ?? 10;
        document.getElementById("dpParticipants").textContent = `${cur} / ${max} dabei`;

        // UI-Switch: Drop-Preview einblenden, Default-Icon+Titel ausblenden,
        // Subtitle auf Drop-spezifischen Call-To-Action.
        document.getElementById("dropPreview").style.display = "block";
        document.getElementById("defaultIcon").style.display = "none";
        document.getElementById("defaultTitle").style.display = "none";
        document.getElementById("subtitle").textContent =
          d.isLive ? "Komm vorbei — öffne den Plan in der App." :
                     "Der Plan ist schon vorbei. Lade dazu und sei beim nächsten dabei.";
      } catch (err) {
        // Silent fail — fallback bleibt aktiv. User sieht weiter den Smart-Banner.
        console.warn("getDropSummary fetch failed", err);
      }
    })();
  </script>
</body>
</html>
